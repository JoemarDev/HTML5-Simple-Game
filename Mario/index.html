<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="assets/css/style.css" rel="stylesheet" />
    <title>Mario</title>
    <script src="./assets/js/jquery-3.6.1.min.js"></script>
    
</head>
<body>
    <div id="game">

          <!-- Config Section -->
          <ul class="config">
            <li class="sound" ></li>
            <li class="music" ></li>
            <li class="reload" ></li>
        </ul>
        <!-- Config Section -->

        <div id="game-screen">
            <!-- Timer box section -->
            <div class="timer_box">
                <strong id="timer" class="timer">-</strong> 후
                <strong id="round" class="round">-</strong>회차 결과가 발표됩니다.
            </div>
            <!-- Timer Box Section -->

            <!-- Mario Top Section -->
            <div class="tab_top_box">
                <div class="in_content">
                    <span class="game-sprite tab_top_1" ></span>
                    <span class="game-sprite tab_top_2" ></span>
                </div>
            </div>
            <!-- Mario Top Section -->

            <!-- Marion Bottom Section -->
            <div class="tab_botton_box">
                <div class="in_content">
                    <span class="imgmario tab_top_1"></span>
                    <span class="imgmario tab_top_2"></span>
                </div>
            </div>
            <!-- Mario Bottom Section -->


        </div>

    </div>
</body>
<script src="./assets/js/script.js"></script>
</html>
