<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/css/style.css" rel="stylesheet" />
    <title>Arcade Roullete</title>
    <script src="./assets/js/jquery-3.6.1.min.js"></script>
</head>

<body onload="InitSounds()">
    <div id="game">

        <!-- Config Section -->
        <ul class="config">
            <li class="sound" onclick="Toogle(this); SoundEffectToogle(this)"></li>
            <li class="music" onclick="Toogle(this); MusicToogle(this);"></li>
            <li class="reload" onclick="ReloadWindow();"></li>
        </ul>
        <!-- Config Section -->

        <!-- Roullete Section -->
        <div id="roullete">
            <div class="routelle-image wheel front"></div>
            <div class="routelle-image wheel back"></div>
            <div class="routelle-image pin"></div>
            <div class="routelle-image center">
                <div class="wrap">
                    <span>ROUND</span>
                    <label class="round">-</label>
                    <span>TIMER</span>
                    <label class="time">-</label>
                </div>
            </div>
            <div class="routelle-image result_box"></div>
        </div>

        <!-- Roullete Section -->

        <!-- History Section -->
        <div class="history scroll">

        </div>
        <!-- History Section -->



    </div>
</body>

<script src="./assets/js/script.js"></script>

</html>
